<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>VU-3D &mdash; three-dimensional design (web edition)</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;color:#d7d7d7;
    font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden;
    -webkit-user-select:none;user-select:none;touch-action:manipulation}
  #wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:10px}
  #scr{position:relative;line-height:0;box-shadow:0 0 0 2px #222,0 8px 40px #000}
  #scr canvas{position:absolute;left:0;top:0;width:100%;height:100%;
    image-rendering:pixelated;image-rendering:crisp-edges}
  #gl{z-index:1}
  #fb{z-index:2}
  #bar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:12px;z-index:3}
  #bar button{font:inherit;font-size:12px;background:#111;color:#d7d7d7;border:1px solid #444;
    border-radius:3px;padding:4px 9px;cursor:pointer}
  #bar button:hover{background:#0000d7;border-color:#d7d7d7;color:#fff}
  #file{display:none}
</style>
</head>
<body>
<div id="wrap">
  <div id="scr"><canvas id="gl"></canvas><canvas id="fb"></canvas></div>
  <div id="bar">
    <button id="bMode">screen: authentic</button>
    <button id="bFull">fullscreen</button>
    <button id="bExport">export .json</button>
    <button id="bImport">import .json</button>
    <button id="bHelp">help</button>
  </div>
</div>
<input id="file" type="file" accept=".json,application/json">
<script>
"use strict";
/* =======================================================================
   VU-3D  (Psion, 1982) -- web edition.
   A single-file, dependency-free re-imagining of the ZX Spectrum program.
   2D chrome is drawn into a 256x192 logical raster; the 3D views are
   rendered with WebGL 2 (grayscale or ordered-dither "patterned" shading)
   instead of the original's CPU dithering.
   ======================================================================= */

/* ------------------------------------------------------------------ font */
/* 8x8 glyphs in the ZX Spectrum idiom; 8 hex bytes per character.        */
const FONT = {
' ':'0000000000000000','!':'0010101010001000','"':'0024240000000000','#':'00247e24247e2400',
'$':'00083e283e0a3e08','%':'0062640810264600','&':'001028102a443a00',"'":'0008102000000000',
'(':'0004080808080400',')':'0020101010102000','*':'000014083e081400','+':'000008083e080800',
',':'0000000000080810','-':'000000003e000000','.':'0000000000181800','/':'0000020408102000',
'0':'003c464a52623c00','1':'0018280808083e00','2':'003c42023c407e00','3':'003c420c02423c00',
'4':'00081828487e0800','5':'007e407c02423c00','6':'003c407c42423c00','7':'007e020408101000',
'8':'003c423c42423c00','9':'003c42423e023c00',':':'0000001000001000',';':'0000100000101020',
'<':'0000040810080400','=':'0000003e003e0000','>':'0000100804081000','?':'003c420408000800',
'@':'003c4a565e403c00','A':'003c42427e424200','B':'007c427c42427c00','C':'003c424040423c00',
'D':'0078444242447800','E':'007e407c40407e00','F':'007e407c40404000','G':'003c42404e423c00',
'H':'0042427e42424200','I':'003e080808083e00','J':'0002020242423c00','K':'0044487048444200',
'L':'0040404040407e00','M':'0042665a42424200','N':'004262524a464200','O':'003c424242423c00',
'P':'007c42427c404000','Q':'003c4242524a3c00','R':'007c42427c444200','S':'003c403c02423c00',
'T':'00fe101010101000','U':'0042424242423c00','V':'0042424242241800','W':'004242425a664200',
'X':'0042241818244200','Y':'0082442810101000','Z':'007e040810207e00','[':'000e080808080e00',
'\\':'0000201008040200',']':'0070101010107000','^':'0000103854101000','_':'00000000000000ff',
'a':'000038043c443c00','b':'0020203c22223c00','c':'00001c2020201c00','d':'0004043c44443c00',
'e':'0000384478403c00','f':'000c101810101000','g':'00003c44443c0438','h':'0040407844444400',
'i':'0010003010103800','j':'0004000404042418','k':'0020283030282400','l':'0010101010100c00',
'm':'0000685454545400','n':'0000784444444400','o':'0000384444443800','p':'0000784444784040',
'q':'00003c44443c0406','r':'00001c2020202000','s':'0000384038047800','t':'0010381010100c00',
'u':'0000444444443800','v':'0000444428281000','w':'0000445454542800','x':'0000442810284400',
'y':'00004444443c0438','z':'00007c0810207c00','©':'3c4299a1a199423c',
'←':'000008103e100800','→':'000008043e040800','↑':'00081c2a08080800',
'↓':'000808082a1c0800','░':'55aa55aa55aa55aa','█':'ffffffffffffffff',
'·':'0000001818000000','°':'0018242418000000'
};
const GLYPH = {};
for (const k in FONT) {
  const a = new Uint8Array(8);
  for (let i = 0; i < 8; i++) a[i] = parseInt(FONT[k].substr(i * 2, 2), 16);
  GLYPH[k] = a;
}

/* --------------------------------------------------------------- palette */
/* The eight ZX Spectrum colours, normal and BRIGHT.                       */
const SPECTRUM = [
  [0, 0, 0], [0, 0, 215], [215, 0, 0], [215, 0, 215],
  [0, 215, 0], [0, 215, 215], [215, 215, 0], [215, 215, 215]
];
const SPECTRUM_NAMES = ['black', 'blue', 'red', 'magenta', 'green', 'cyan', 'yellow', 'white'];
function specRGB(i, bright) {
  const c = SPECTRUM[i & 7];
  return bright ? c.map(v => (v ? 255 : 0)) : c.slice();
}
function packRGB(c) { return (255 << 24) | (c[2] << 16) | (c[1] << 8) | c[0]; }
function col(i, bright) { return packRGB(specRGB(i, bright)); }

/* ---------------------------------------------------------------- raster */
/* 256x192 logical screen. All 2D drawing goes through here; every call    */
/* takes logical coordinates and is multiplied by the render scale S.      */
const W = 256, H = 192;
const Raster = {
  S: 1, cv: null, ctx: null, img: null, buf: null, w: 0, h: 0,
  init(cv) { this.cv = cv; this.ctx = cv.getContext('2d'); },
  resize(S) {
    this.S = S; this.w = W * S; this.h = H * S;
    this.cv.width = this.w; this.cv.height = this.h;
    this.img = this.ctx.createImageData(this.w, this.h);
    this.buf = new Uint32Array(this.img.data.buffer);
  },
  clear(c) { this.buf.fill(c >>> 0); },
  /* one logical pixel = an SxS block */
  px(x, y, c) {
    x = x | 0; y = y | 0;
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    const S = this.S, b = this.buf, w = this.w;
    let o = (y * S) * w + x * S;
    for (let j = 0; j < S; j++, o += w) for (let i = 0; i < S; i++) b[o + i] = c;
  },
  rect(x, y, rw, rh, c) {
    x = Math.max(0, x | 0); y = Math.max(0, y | 0);
    const x1 = Math.min(W, (x + rw) | 0), y1 = Math.min(H, (y + rh) | 0);
    const S = this.S, b = this.buf, w = this.w;
    for (let yy = y; yy < y1; yy++) {
      for (let j = 0; j < S; j++) {
        const o = (yy * S + j) * w;
        b.fill(c, o + x * S, o + x1 * S);
      }
    }
  },
  line(x0, y0, x1, y1, c, dash) {
    x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
    const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
    const dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
    let err = dx + dy, n = 0;
    for (;;) {
      if (!dash || (n >> 1) % 2 === 0) this.px(x0, y0, c);
      n++;
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  },
  glyph(x, y, ch, ink, paper) {
    const g = GLYPH[ch] || GLYPH['?'];
    for (let r = 0; r < 8; r++) {
      const bits = g[r];
      for (let b = 0; b < 8; b++) {
        const on = (bits >> (7 - b)) & 1;
        if (on) this.px(x + b, y + r, ink);
        else if (paper !== undefined) this.px(x + b, y + r, paper);
      }
    }
  },
  textPx(x, y, s, ink, paper) {
    for (let i = 0; i < s.length; i++) this.glyph(x + i * 8, y, s[i], ink, paper);
  },
  text(cx, cy, s, ink, paper) { this.textPx(cx * 8, cy * 8, s, ink, paper); },
  flush() { this.ctx.putImageData(this.img, 0, 0); }
};

/* ------------------------------------------------------------------ math */
function mat4() { return new Float32Array(16); }
function ident(m) { m.fill(0); m[0] = m[5] = m[10] = m[15] = 1; return m; }
function mul(o, a, b) {
  const r = mat4();
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + j] * b[i * 4 + k];
    r[i * 4 + j] = s;
  }
  o.set(r); return o;
}
function perspective(m, fovy, asp, n, f) {
  const t = 1 / Math.tan(fovy / 2);
  m.fill(0); m[0] = t / asp; m[5] = t; m[10] = (f + n) / (n - f);
  m[11] = -1; m[14] = 2 * f * n / (n - f); return m;
}
function lookAt(m, eye, ctr, up) {
  const z = norm3([eye[0] - ctr[0], eye[1] - ctr[1], eye[2] - ctr[2]]);
  const x = norm3(cross3(up, z)), y = cross3(z, x);
  m[0] = x[0]; m[1] = y[0]; m[2] = z[0]; m[3] = 0;
  m[4] = x[1]; m[5] = y[1]; m[6] = z[1]; m[7] = 0;
  m[8] = x[2]; m[9] = y[2]; m[10] = z[2]; m[11] = 0;
  m[12] = -dot3(x, eye); m[13] = -dot3(y, eye); m[14] = -dot3(z, eye); m[15] = 1;
  return m;
}
function cross3(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
function dot3(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function norm3(a) { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }

/* --------------------------------------------------------- 2D geometry   */
function cross2(o, a, b) { return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]); }
function onSeg(a, b, p) {
  return Math.min(a[0], b[0]) <= p[0] && p[0] <= Math.max(a[0], b[0]) &&
         Math.min(a[1], b[1]) <= p[1] && p[1] <= Math.max(a[1], b[1]);
}
/* true when segments a-b and c-d cross (touching counts as crossing) */
function segCross(a, b, c, d) {
  const d1 = cross2(c, d, a), d2 = cross2(c, d, b);
  const d3 = cross2(a, b, c), d4 = cross2(a, b, d);
  if (((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) &&
      ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0))) return true;
  if (d1 === 0 && onSeg(c, d, a)) return true;
  if (d2 === 0 && onSeg(c, d, b)) return true;
  if (d3 === 0 && onSeg(a, b, c)) return true;
  if (d4 === 0 && onSeg(a, b, d)) return true;
  return false;
}
function ringSegs(pts, closed) {
  const s = [], n = pts.length;
  for (let i = 0; i + 1 < n; i++) s.push([pts[i], pts[i + 1]]);
  if (closed && n > 2) s.push([pts[n - 1], pts[0]]);
  return s;
}
function ringsCross(A, B) {
  const sa = ringSegs(A, true), sb = ringSegs(B, true);
  for (const p of sa) for (const q of sb) if (segCross(p[0], p[1], q[0], q[1])) return true;
  return false;
}
function selfCross(pts, closed) {
  const s = ringSegs(pts, closed);
  for (let i = 0; i < s.length; i++)
    for (let j = i + 2; j < s.length; j++) {
      if (i === 0 && j === s.length - 1 && closed) continue; /* adjacent through wrap */
      if (segCross(s[i][0], s[i][1], s[j][0], s[j][1])) return true;
    }
  return false;
}
function centroid(pts) {
  let x = 0, y = 0; for (const p of pts) { x += p[0]; y += p[1]; }
  return [x / pts.length, y / pts.length];
}
function signedArea(pts) {
  let a = 0; for (let i = 0; i < pts.length; i++) {
    const p = pts[i], q = pts[(i + 1) % pts.length];
    a += p[0] * q[1] - q[0] * p[1];
  }
  return a / 2;
}
function pointInTri(p, a, b, c) {
  const d1 = cross2(a, b, p), d2 = cross2(b, c, p), d3 = cross2(c, a, p);
  const neg = (d1 < 0) || (d2 < 0) || (d3 < 0), pos = (d1 > 0) || (d2 > 0) || (d3 > 0);
  return !(neg && pos);
}
/* ear clipping; returns index triples into pts */
function triangulate(pts) {
  const n = pts.length;
  if (n < 3) return [];
  let idx = []; for (let i = 0; i < n; i++) idx.push(i);
  if (signedArea(pts) < 0) idx.reverse();
  const tris = [];
  let guard = 0;
  while (idx.length > 2 && guard++ < 5000) {
    let clipped = false;
    for (let i = 0; i < idx.length; i++) {
      const a = idx[(i + idx.length - 1) % idx.length], b = idx[i], c = idx[(i + 1) % idx.length];
      if (cross2(pts[a], pts[b], pts[c]) <= 0) continue;
      let ok = true;
      for (const j of idx) {
        if (j === a || j === b || j === c) continue;
        if (pointInTri(pts[j], pts[a], pts[b], pts[c])) { ok = false; break; }
      }
      if (!ok) continue;
      tris.push([a, b, c]); idx.splice(i, 1); clipped = true; break;
    }
    if (!clipped) { for (let i = 1; i < idx.length - 1; i++) tris.push([idx[0], idx[i], idx[i + 1]]); break; }
  }
  return tris;
}

/* ================================================================= model */
/* A data file: an ordered stack of Z planes, each holding one ring of     */
/* points per figure.  A figure keeps the same vertex count on every plane */
/* (the original only allowed magnify / reduce / shift), so lofting is a   */
/* straight index-to-index correspondence.                                 */
const MW = 248, MH = 152;             /* model coordinate extent */
const ZSTEP = 5;

function newModel() {
  return { planes: [{ z: 0, fresh: true, rings: [] }], figs: {}, nextId: 1 };
}
function clonePts(p) { return p.map(q => [q[0], q[1]]); }
function curPlane(m, i) { return m.planes[i]; }
function ringOf(plane, id) { return plane.rings.find(r => r.fig === id) || null; }
function figClosed(m, id, planeIdx) {
  const f = m.figs[id];
  return f && f.closedAt !== null && f.closedAt <= planeIdx;
}

/* --------------------------------------------------------- mesh building */
function buildMesh(m) {
  const pos = [], nrm = [], lin = [];
  /* The Z planes stack along world Y (up), so each slice lies flat in the
     horizontal XZ plane -- the "salami slice" picture from the manual. */
  const P = (p, z) => [p[0] - MW / 2, z, -(p[1] - MH / 2)];
  function tri(a, b, c, n) {
    pos.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]);
    for (let i = 0; i < 3; i++) nrm.push(n[0], n[1], n[2]);
  }
  function seg(a, b) { lin.push(a[0], a[1], a[2], b[0], b[1], b[2]); }

  for (const id in m.figs) {
    const stack = [];
    for (const pl of m.planes) {
      const r = ringOf(pl, +id);
      if (r && r.pts.length >= 3) stack.push({ z: pl.z, pts: r.pts });
    }
    if (!stack.length) continue;
    /* ring outlines (also the wire edges of each slice) */
    for (const s of stack) {
      const n = s.pts.length;
      for (let i = 0; i < n; i++) seg(P(s.pts[i], s.z), P(s.pts[(i + 1) % n], s.z));
    }
    /* lofted sides */
    for (let k = 0; k + 1 < stack.length; k++) {
      const A = stack[k], B = stack[k + 1], n = Math.min(A.pts.length, B.pts.length);
      for (let i = 0; i < n; i++) {
        const i2 = (i + 1) % n;
        const a = P(A.pts[i], A.z), b = P(A.pts[i2], A.z);
        const c = P(B.pts[i2], B.z), d = P(B.pts[i], B.z);
        const nn = norm3(cross3([b[0] - a[0], b[1] - a[1], b[2] - a[2]],
                                [d[0] - a[0], d[1] - a[1], d[2] - a[2]]));
        tri(a, b, c, nn); tri(a, c, d, nn);
        seg(a, d);
      }
    }
    /* caps */
    const f = m.figs[id] || {};
    const capEnds = [];
    if (f.capBottom !== false) capEnds.push([stack[0], [0, -1, 0]]);
    if (stack.length > 1 && f.capTop !== false) capEnds.push([stack[stack.length - 1], [0, 1, 0]]);
    else if (stack.length === 1 && f.capTop !== false) capEnds.push([stack[0], [0, 1, 0]]);
    for (const [s, nn] of capEnds) {
      for (const t of triangulate(s.pts))
        tri(P(s.pts[t[0]], s.z), P(s.pts[t[1]], s.z), P(s.pts[t[2]], s.z), nn);
    }
  }
  /* bounds */
  let lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
  const scan = pos.length ? pos : lin;
  for (let i = 0; i < scan.length; i += 3)
    for (let k = 0; k < 3; k++) {
      lo[k] = Math.min(lo[k], scan[i + k]); hi[k] = Math.max(hi[k], scan[i + k]);
    }
  if (!scan.length) { lo = [-1, -1, -1]; hi = [1, 1, 1]; }
  const ctr = [(lo[0] + hi[0]) / 2, (lo[1] + hi[1]) / 2, (lo[2] + hi[2]) / 2];
  const rad = Math.max(1, Math.hypot(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]) / 2);
  return {
    pos: new Float32Array(pos), nrm: new Float32Array(nrm),
    lin: new Float32Array(lin), ctr, rad,
    ntri: pos.length / 9, nseg: lin.length / 6
  };
}

/* ================================================================ WebGL  */
const BAYER = [
   0, 32,  8, 40,  2, 34, 10, 42, 48, 16, 56, 24, 50, 18, 58, 26,
  12, 44,  4, 36, 14, 46,  6, 38, 60, 28, 52, 20, 62, 30, 54, 22,
   3, 35, 11, 43,  1, 33,  9, 41, 51, 19, 59, 27, 49, 17, 57, 25,
  15, 47,  7, 39, 13, 45,  5, 37, 63, 31, 55, 23, 61, 29, 53, 21];

const VS_SOLID = `#version 300 es
in vec3 aPos; in vec3 aNrm;
uniform mat4 uMVP;
out vec3 vN;
void main(){ vN = aNrm; gl_Position = uMVP * vec4(aPos,1.0); }`;

const FS_SOLID = `#version 300 es
precision highp float;
in vec3 vN;
uniform vec3 uLight, uPaper, uInk;
uniform int uMode;          // 0 = grayscale ramp, 1 = Bayer ordered dither, 2 = ZX Spectrum halftone
uniform float uPix;         // device pixels per logical pixel
out vec4 outColor;
const float bayer[64] = float[64](${BAYER.join('.0,')}.0);
/* ZX Spectrum-style halftone: 9 levels (0=all paper … 8=all ink), 8 rows each.
   Each row is 8 bits; bit 7 = leftmost pixel (x%8==0).                       */
const int PAT[72] = int[72](
    0,  0,  0,  0,  0,  0,  0,  0,   // 0  all paper
  128,  0,  0,  0,  8,  0,  0,  0,   // 1  ~14% sparse dots
  136,  0, 34,  0,136,  0, 34,  0,   // 2  ~25% quarter-density diagonal
  170,  0,170,  0,170,  0,170,  0,   // 3  ~37% alternating columns, half rows
  170, 85,170, 85,170, 85,170, 85,   // 4  ~50% full checkerboard
  255, 85,255, 85,255, 85,255, 85,   // 5  ~62% full rows + half rows
  255,119,255,221,255,119,255,221,   // 6  ~75% dense with diagonal gaps
  255,255,127,255,255,255,247,255,   // 7  ~87% near-solid, rare holes
  255,255,255,255,255,255,255,255    // 8  all ink
);
void main(){
  vec3 N = normalize(vN);
  if(!gl_FrontFacing) N = -N;
  float d = max(dot(N, normalize(uLight)), 0.0);
  float lum = clamp(0.18 + 0.82*d, 0.0, 1.0);
  if(uMode == 0){
    outColor = vec4(mix(uInk, uPaper, lum), 1.0);
  } else if(uMode == 1){
    vec2 p = floor(gl_FragCoord.xy / uPix);
    int i = int(mod(p.x, 8.0)) + 8 * int(mod(p.y, 8.0));
    float t = (bayer[i] + 0.5) / 64.0;
    outColor = vec4(lum > t ? uPaper : uInk, 1.0);
  } else {
    /* quantise to one of 9 discrete levels then tile the matching pattern */
    int level = clamp(int(lum * 8.0 + 0.5), 0, 8);
    vec2 p = floor(gl_FragCoord.xy / uPix);
    int px = int(mod(p.x, 8.0));
    int py = int(mod(p.y, 8.0));
    int row = PAT[level * 8 + py];
    bool isInk = ((row >> (7 - px)) & 1) == 1;
    outColor = vec4(isInk ? uInk : uPaper, 1.0);
  }
}`;

const VS_LINE = `#version 300 es
in vec3 aPos; uniform mat4 uMVP;
void main(){ gl_Position = uMVP * vec4(aPos,1.0); }`;

const FS_LINE = `#version 300 es
precision highp float; uniform vec3 uCol; out vec4 outColor;
void main(){ outColor = vec4(uCol,1.0); }`;

const GL = {
  gl: null, ok: false, mesh: null,
  init(cv) {
    const gl = cv.getContext('webgl2', {
      alpha: true, antialias: true, premultipliedAlpha: true, preserveDrawingBuffer: true
    });
    if (!gl) return false;
    this.gl = gl; this.ok = true;
    this.pSolid = this.prog(VS_SOLID, FS_SOLID);
    this.pLine = this.prog(VS_LINE, FS_LINE);
    this.bPos = gl.createBuffer(); this.bNrm = gl.createBuffer(); this.bLin = gl.createBuffer();
    this.vaoSolid = gl.createVertexArray();
    gl.bindVertexArray(this.vaoSolid);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.bPos);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.bNrm);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
    this.vaoLine = gl.createVertexArray();
    gl.bindVertexArray(this.vaoLine);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.bLin);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);
    return true;
  },
  prog(vsrc, fsrc) {
    const gl = this.gl;
    const sh = (t, s) => {
      const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o);
      if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(o), s);
      return o;
    };
    const p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, vsrc));
    gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fsrc));
    gl.bindAttribLocation(p, 0, 'aPos'); gl.bindAttribLocation(p, 1, 'aNrm');
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
    return p;
  },
  upload(mesh) {
    const gl = this.gl; this.mesh = mesh;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.bPos); gl.bufferData(gl.ARRAY_BUFFER, mesh.pos, gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.bNrm); gl.bufferData(gl.ARRAY_BUFFER, mesh.nrm, gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.bLin); gl.bufferData(gl.ARRAY_BUFFER, mesh.lin, gl.STATIC_DRAW);
  },
  resize(S) {
    const cv = this.gl.canvas;
    cv.width = W * S; cv.height = H * S;
  }
};

/* ================================================================= state */
const VIEW_TOP = 24, VIEW_BOT = 184;      /* logical y range of the work area */
const VIEW_H = VIEW_BOT - VIEW_TOP;       /* 160 */

const app = {
  screenMode: 'authentic',     /* 'authentic' | 'highres' */
  S: 1, Z: 1,
  mode: 'title',
  model: newModel(),
  planeIdx: 0,
  selIdx: 0,
  cursor: [124, 76],
  open: null,                  /* {figId, pts, started} while inside OPEN  */
  cam: { lat: 0.35, lon: 0.6, dist: 0, scale: 1 },
  pic: { type: 'wire', light: [0, 0], shade: 'dither' },  /* light = [h,v] in -1..1 */
  colours: { paper: 7, paperB: 1, ink: 0, inkB: 0, border: 0, bpaper: 1, bpaperB: 1, bink: 7, binkB: 1 },
  prompt: null,                /* {text, keys, cb} */
  input: null,                 /* {label, value, cb} */
  message: '',
  msgUntil: 0,
  meshDirty: true,
  dirty: true,
  hits: [],
  sound: true,
  fileName: 'untitled'
};

function paperC() { return col(app.colours.paper, app.colours.paperB); }
function inkC() { return col(app.colours.ink, app.colours.inkB); }
function bPaperC() { return col(app.colours.bpaper, app.colours.bpaperB); }
function bInkC() { return col(app.colours.bink, app.colours.binkB); }
function paperV() { return specRGB(app.colours.paper, app.colours.paperB).map(v => v / 255); }
function inkV() { return specRGB(app.colours.ink, app.colours.inkB).map(v => v / 255); }

function mark() { app.dirty = true; }
function say(s, ms) { app.message = s; app.msgUntil = performance.now() + (ms || 2500); mark(); }

/* ------------------------------------------------------------------ beep */
let AC = null;
function beep(freq, dur, type) {
  if (!app.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.value = 0.05; o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + (dur || 0.04));
  } catch (e) { /* audio unavailable */ }
}
const bipOK = () => beep(880, 0.03);
const bipNo = () => beep(120, 0.12, 'sawtooth');

/* ================================================================ layout */
function fit() {
  const winW = window.innerWidth, winH = window.innerHeight - 46;
  const Z = Math.max(1, Math.floor(Math.min(winW / W, winH / H)));
  app.Z = Z;
  const dpr = window.devicePixelRatio || 1;
  const S = app.screenMode === 'authentic' ? 1 : Math.min(6, Math.max(1, Math.round(Z * dpr)));
  app.S = S;
  Raster.resize(S);
  if (GL.ok) GL.resize(S);
  const scr = document.getElementById('scr');
  scr.style.width = (W * Z) + 'px';
  scr.style.height = (H * Z) + 'px';
  document.body.style.background = 'rgb(' + specRGB(app.colours.border, 0).join(',') + ')';
  mark();
}

function drawBanner() {
  const b = bannerFor();
  Raster.rect(0, 0, W, 24, bPaperC());
  if (!b) return;
  Raster.text(0, 0, b.title, bPaperC(), bInkC());     /* inverse video title */
  for (const [r, c, label, key] of b.items) {

function drawStatus(left, right) {
  Raster.rect(0, VIEW_BOT, W, 8, paperC());
  if (left) Raster.text(0, 23, left, inkC(), paperC());
  if (right) Raster.textPx(W - right.length * 8, VIEW_BOT, right, inkC(), paperC());
}
function pad3(n) { n = Math.round(n); const s = Math.abs(n) + ''; return (n < 0 ? '-' : '') + '000'.slice(s.length - (n < 0 ? 1 : 0)) + s; }

/* =============================================================== editor  */
/* model (x,y) -> screen: x' = 4 + x , y' = VIEW_BOT - 8 - y               */
const OX = 4, OY = VIEW_BOT - 8;
const sx = x => OX + x, sy = y => OY - y;
const ux = x => x - OX, uy = y => OY - y;

function drawWorkspace() {
  Raster.rect(0, VIEW_TOP, W, VIEW_H, paperC());
  const c = inkC();
  /* Y axis (left) and X axis (bottom), with ticks and arrow heads */
  Raster.line(OX, VIEW_TOP + 2, OX, OY, c);
  Raster.line(OX, OY, W - 3, OY, c);
  Raster.line(OX, VIEW_TOP + 2, OX - 2, VIEW_TOP + 5, c);
  Raster.line(OX, VIEW_TOP + 2, OX + 2, VIEW_TOP + 5, c);
  Raster.line(W - 3, OY, W - 6, OY - 2, c);
  Raster.line(W - 3, OY, W - 6, OY + 2, c);
  for (let x = 8; x < MW; x += 8) Raster.line(sx(x), OY, sx(x), OY - 2, c);
  for (let y = 8; y < MH; y += 8) Raster.line(OX, sy(y), OX + 2, sy(y), c);
}
function drawRing(pts, closed, dotted) {
  const c = inkC();
  for (let i = 0; i + 1 < pts.length; i++)
    Raster.line(sx(pts[i][0]), sy(pts[i][1]), sx(pts[i + 1][0]), sy(pts[i + 1][1]), c, dotted);
  if (closed && pts.length > 2)
    Raster.line(sx(pts[pts.length - 1][0]), sy(pts[pts.length - 1][1]), sx(pts[0][0]), sy(pts[0][1]), c, dotted);
}
function drawCursor() {
  const c = inkC(), x = sx(app.cursor[0]), y = sy(app.cursor[1]);
  const on = (performance.now() % 600) < 400;
  if (!on) return;
  Raster.line(x - 3, y, x + 3, y, c);
  Raster.line(x, y - 3, x, y + 3, c);
}
function drawPlane() {
  const pl = curPlane(app.model, app.planeIdx);
  drawWorkspace();
  pl.rings.forEach((r, i) => drawRing(r.pts, true, i === app.selIdx && pl.rings.length > 1));
  if (app.open && app.open.pts.length) drawRing(app.open.pts, false, false);
}

/* ============================================================== 3D draw  */
function ensureMesh() {
  if (!app.meshDirty) return;
  const mesh = buildMesh(app.model);
  if (GL.ok) GL.upload(mesh);
  app.meshDirty = false;
  if (!app.cam.dist) app.cam.dist = mesh.rad * 3.2;
}
function draw3D(kind) {
  if (!GL.ok) { Raster.rect(0, VIEW_TOP, W, VIEW_H, paperC());
    Raster.text(1, 12, 'WebGL 2 not available', inkC(), paperC()); return; }
  ensureMesh();
  const gl = GL.gl, S = app.S, mesh = GL.mesh;
  const vx = 0, vy = 8 * S, vw = W * S, vh = VIEW_H * S;
  gl.viewport(vx, vy, vw, vh);
  gl.enable(gl.SCISSOR_TEST); gl.scissor(vx, vy, vw, vh);
  const pv = paperV();
  gl.clearColor(pv[0], pv[1], pv[2], 1);
  gl.clearDepth(1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);
  gl.disable(gl.CULL_FACE);

  const c = app.cam, ctr = mesh.ctr;
  const dir = [Math.cos(c.lat) * Math.sin(c.lon), Math.sin(c.lat), Math.cos(c.lat) * Math.cos(c.lon)];
  const eye = [ctr[0] + dir[0] * c.dist, ctr[1] + dir[1] * c.dist, ctr[2] + dir[2] * c.dist];
  const proj = perspective(mat4(), 50 * Math.PI / 180, vw / vh, Math.max(0.5, mesh.rad * 0.01), c.dist + mesh.rad * 8);
  proj[0] *= c.scale; proj[5] *= c.scale;
  const view = lookAt(mat4(), eye, ctr, [0, 1, 0]);
  const mvp = mul(mat4(), proj, view);

  /* viewer-relative light, as in the original's above/centre/below x l/c/r */
  const fwd = norm3(dir);
  const right = norm3(cross3([0, 1, 0], fwd));
  const up = cross3(fwd, right);
  const L = norm3([
    fwd[0] * 0.9 + right[0] * app.pic.light[0] + up[0] * app.pic.light[1],
    fwd[1] * 0.9 + right[1] * app.pic.light[0] + up[1] * app.pic.light[1],
    fwd[2] * 0.9 + right[2] * app.pic.light[0] + up[2] * app.pic.light[1]
  ]);

  const drawSolid = (mode, colPaper, colInk) => {
    if (!mesh.ntri) return;
    gl.useProgram(GL.pSolid);
    gl.uniformMatrix4fv(gl.getUniformLocation(GL.pSolid, 'uMVP'), false, mvp);
    gl.uniform3fv(gl.getUniformLocation(GL.pSolid, 'uLight'), new Float32Array(L));
    gl.uniform3fv(gl.getUniformLocation(GL.pSolid, 'uPaper'), new Float32Array(colPaper));
    gl.uniform3fv(gl.getUniformLocation(GL.pSolid, 'uInk'), new Float32Array(colInk));
    gl.uniform1i(gl.getUniformLocation(GL.pSolid, 'uMode'), mode);
    gl.uniform1f(gl.getUniformLocation(GL.pSolid, 'uPix'), S);
    gl.bindVertexArray(GL.vaoSolid);
    gl.drawArrays(gl.TRIANGLES, 0, mesh.ntri * 3);
  };
  const drawLines = (colr) => {
    if (!mesh.nseg) return;
    gl.useProgram(GL.pLine);
    gl.uniformMatrix4fv(gl.getUniformLocation(GL.pLine, 'uMVP'), false, mvp);
    gl.uniform3fv(gl.getUniformLocation(GL.pLine, 'uCol'), new Float32Array(colr));
    gl.bindVertexArray(GL.vaoLine);
    gl.drawArrays(gl.LINES, 0, mesh.nseg * 2);
  };

  if (kind === 'wire') {
    gl.disable(gl.DEPTH_TEST);
    drawLines(inkV());
  } else if (kind === 'hidden') {
    /* fill every face in the paper colour, then draw only surviving edges */
    gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(1.5, 2.0);
    drawSolid(0, paperV(), paperV());
    gl.disable(gl.POLYGON_OFFSET_FILL);
    drawLines(inkV());
  } else if (kind === 'gray') {
    drawSolid(0, paperV(), inkV());
  } else if (kind === 'pattern') {
    drawSolid(2, paperV(), inkV());
  } else {
    drawSolid(1, paperV(), inkV());   /* 'dither' = Bayer */
  }
  gl.bindVertexArray(null);
  gl.disable(gl.SCISSOR_TEST);
}
function clearViewHole() {
  /* leave the 3D region transparent so the GL canvas below shows through */
  Raster.rect(0, VIEW_TOP, W, VIEW_H, 0);
}

  ];
  items.forEach(([k, label], i) => {

/* ================================================================= paint */
function paint() {
  app.hits = [];
  switch (app.mode) {
    case 'title': drawTitle(); break;
    case 'menu': drawMenu(); break;
    case 'help': drawHelp(); break;
    case 'save': case 'load': drawFiles(app.mode); break;
    case 'colour': drawColour(); break;
    case 'create': case 'open': {
      Raster.clear(paperC());
      drawBanner();
      drawPlane();
      if (app.mode === 'open') drawCursor();
      const pl = curPlane(app.model, app.planeIdx);
      const left = app.mode === 'open'
        ? 'x=' + pad3(app.cursor[0]) + ' y=' + pad3(app.cursor[1])
        : (pl.rings.length ? 'figure ' + (app.selIdx + 1) + '/' + pl.rings.length : 'no figure');
      drawStatus(left, 'z=' + pad3(pl.z));
      break;
    }
    case 'modify': {
      Raster.clear(paperC());
      drawBanner();
      drawPlane();
      const pl = curPlane(app.model, app.planeIdx);
      drawStatus('plane ' + (app.planeIdx + 1) + '/' + app.model.planes.length, 'z=' + pad3(pl.z));
      break;
    }
    case 'display': case 'picture': {
      Raster.clear(paperC());
      drawBanner();
      draw3D(app.mode === 'display' ? 'wire' : app.pic.type);
      clearViewHole();
      const c = app.cam;
      const t = app.mode === 'display' ? 'wire line'
        : ({ wire: 'wire line', hidden: 'hidden line', gray: 'shade: grey', pattern: 'shade: pattern', dither: 'shade: Bayer' })[app.pic.type];
      drawStatus(t, 'lat' + pad3(c.lat * 180 / Math.PI) + ' lon' + pad3(((c.lon * 180 / Math.PI) % 360 + 360) % 360));
      break;
    }
  }
  drawPrompt();
  if (app.message && performance.now() < app.msgUntil) {
    Raster.rect(0, VIEW_BOT, W, 8, inkC());
    Raster.text(0, 23, app.message.slice(0, 32), paperC(), inkC());
  }
  Raster.flush();
}

/* ============================================================ create ops */
function newFigure(pts) {
  const m = app.model, id = m.nextId++;
  m.figs[id] = { id, capBottom: true, capTop: true, closedAt: null };
  curPlane(m, app.planeIdx).rings.push({ fig: id, pts });
  app.selIdx = curPlane(m, app.planeIdx).rings.length - 1;
  curPlane(m, app.planeIdx).fresh = false;
  app.meshDirty = true;
}
function otherRings(exceptIdx) {
  const pl = curPlane(app.model, app.planeIdx);
  return pl.rings.filter((_, i) => i !== exceptIdx).map(r => r.pts);
}
/* would this candidate ring cross itself or any other figure? */
function ringLegal(pts, closed, exceptIdx) {
  if (selfCross(pts, closed)) return false;
  for (const o of otherRings(exceptIdx)) {
    const segs = ringSegs(pts, closed), os = ringSegs(o, true);
    for (const a of segs) for (const b of os) if (segCross(a[0], a[1], b[0], b[1])) return false;
  }
  return true;
}
function transformRing(idx, fn) {
  const pl = curPlane(app.model, app.planeIdx);
  const r = pl.rings[idx]; if (!r) return false;
  const np = r.pts.map(fn).map(p => [
    Math.max(0, Math.min(MW, Math.round(p[0]))),
    Math.max(0, Math.min(MH, Math.round(p[1])))
  ]);
  if (!ringLegal(np, true, idx)) return false;
  r.pts = np; pl.fresh = false; app.meshDirty = true; return true;
}
function magnify(k) {
  const pl = curPlane(app.model, app.planeIdx);
  const r = pl.rings[app.selIdx]; if (!r) { bipNo(); return; }
  const c = centroid(r.pts);
  if (!transformRing(app.selIdx, p => [c[0] + (p[0] - c[0]) * k, c[1] + (p[1] - c[1]) * k])) { bipNo(); say('cannot: figures would meet'); }
  else { bipOK(); mark(); }
}
function shiftFig(dx, dy) {
  const pl = curPlane(app.model, app.planeIdx);
  if (!pl.rings[app.selIdx]) { bipNo(); return; }
  if (!transformRing(app.selIdx, p => [p[0] + dx, p[1] + dy])) { bipNo(); say('cannot: figures would meet'); }
  else mark();
}
function nextZ(step) {
  const m = app.model, pl = curPlane(m, app.planeIdx);
  const isLast = app.planeIdx === m.planes.length - 1;
  if (isLast && pl.fresh && app.planeIdx > 0) {
    pl.z += step;                       /* keep pressing N to dial Z in */
  } else {
    const rings = pl.rings
      .filter(r => !figClosed(m, r.fig, app.planeIdx))
      .map(r => ({ fig: r.fig, pts: clonePts(r.pts) }));
    if (!rings.length && !pl.rings.length) { bipNo(); say('open a figure first'); return; }
    m.planes.push({ z: pl.z + step, fresh: true, rings });
    app.planeIdx = m.planes.length - 1;
    app.selIdx = Math.min(app.selIdx, Math.max(0, rings.length - 1));
  }
  app.meshDirty = true; bipOK(); mark();
}
function closeFigure() {
  const m = app.model, pl = curPlane(m, app.planeIdx);
  const r = pl.rings[app.selIdx];
  if (!r) { bipNo(); return; }
  if (figClosed(m, r.fig, app.planeIdx)) { say('figure already closed'); bipNo(); return; }
  app.prompt = {
    title: 'CLOSE', text: 'leave the top of the object open?',
    text2: 'Y = yes (open)   N = no (solid)',
    keys: { y: () => finishClose(r.fig, false), n: () => finishClose(r.fig, true) }
  };
  mark();
}
function finishClose(figId, capped) {
  const m = app.model;
  m.figs[figId].capTop = capped;
  m.figs[figId].closedAt = app.planeIdx;
  app.prompt = null; app.meshDirty = true; bipOK();
  say('figure closed'); mark();
}
function closeAllOpen() {
  const m = app.model, last = m.planes.length - 1;
  for (const r of m.planes[last].rings)
    if (!figClosed(m, r.fig, last)) m.figs[r.fig].closedAt = last;
  app.meshDirty = true;
}

/* ================================================================= files */
const LSKEY = 'vu3d.files';
function storageOK() {
  try { localStorage.setItem('vu3d.probe', '1'); localStorage.removeItem('vu3d.probe'); return true; }
  catch (e) { return false; }
}
function readStore() {
  try { return JSON.parse(localStorage.getItem(LSKEY) || '{}'); } catch (e) { return {}; }
}
function writeStore(o) {
  try { localStorage.setItem(LSKEY, JSON.stringify(o)); return true; }
  catch (e) { say('storage unavailable'); return false; }
}
function listFiles() { return Object.keys(readStore()).sort(); }
function saveFile(name) {
  const o = readStore(); o[name] = app.model;
  if (writeStore(o)) { app.fileName = name; say('saved "' + name + '"'); bipOK(); }
}
function loadFile(name) {
  const o = readStore();
  if (!o[name]) { bipNo(); return; }
  adoptModel(o[name], name);
}
function adoptModel(m, name) {
  app.model = m; app.fileName = name || 'untitled';
  app.planeIdx = 0; app.selIdx = 0; app.open = null;
  app.meshDirty = true; app.cam.dist = 0; app.cam.scale = 1;
  say('loaded "' + app.fileName + '"'); bipOK(); mark();
}

/* The built-in EXAMPLE: the wine glass and cube from Psion's own EXAMPLE
   tape, recovered from the memory image in VU-3D/VU3DEXMP.TAP -- vertex
   table at 32814 (x,y,z as signed words), face list at 61280.  The original
   Z axis runs downward, so it is flipped here to stand the glass on its
   foot, and everything is scaled by 0.864 to fit this workspace.
   Each ring is [z, x0,y0, x1,y1, ...]; cap is [bottom, top].            */
const EXAMPLE_FIGS = [
  { cap: [1, 0], rings: [
    [0,175,50,169,70,154,86,134,91,114,86,98,71,93,50,98,28,112,15,134,9,154,15,169,28],
    [7,139,49,138,53,135,55,132,56,129,55,127,53,126,49,127,46,128,44,132,43,135,44,138,46],
    [86,139,49,138,53,135,55,132,56,129,55,127,53,126,49,127,46,128,44,132,43,135,44,138,46],
    [104,153,49,150,60,142,67,132,70,122,67,114,60,112,49,114,39,121,32,132,29,142,32,150,39],
    [130,167,50,162,66,150,79,133,84,115,79,102,67,98,50,102,32,114,20,133,16,150,20,162,32],
    [160,178,50,171,72,155,88,133,94,111,88,94,73,89,50,94,27,109,11,133,6,155,11,171,27],
    [171,178,50,171,72,155,88,133,94,111,88,94,73,89,50,94,27,109,11,133,6,155,11,171,27],
    [200,175,50,169,70,154,86,134,91,114,86,98,71,93,50,98,28,112,15,134,9,154,15,169,28]] },
  { cap: [1, 1], rings: [
    [43,70,146,70,107,109,107,109,146],
    [73,70,146,70,107,109,107,109,146]] }
];
function exampleModel() {
  const m = newModel();
  m.planes = [];
  const zs = [...new Set(EXAMPLE_FIGS.flatMap(f => f.rings.map(r => r[0])))].sort((a, b) => a - b);
  zs.forEach(z => m.planes.push({ z, fresh: false, rings: [] }));
  for (const f of EXAMPLE_FIGS) {
    const id = m.nextId++;
    m.figs[id] = { id, capBottom: !!f.cap[0], capTop: !!f.cap[1], closedAt: null };
    for (const r of f.rings) {
      const pts = [];
      for (let i = 1; i < r.length; i += 2) pts.push([r[i], r[i + 1]]);
      m.planes[zs.indexOf(r[0])].rings.push({ fig: id, pts });
    }
    m.figs[id].closedAt = zs.indexOf(f.rings[f.rings.length - 1][0]);
  }
  return m;
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(app.model)], { type: 'application/json' });
  dl(blob, app.fileName.replace(/\W+/g, '_') + '.vu3d.json');
  say('exported');
}
function dl(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function keepPNG() {
  const c = document.createElement('canvas');
  c.width = Raster.w; c.height = Raster.h;
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  x.fillStyle = 'rgb(' + specRGB(app.colours.paper, app.colours.paperB).join(',') + ')';
  x.fillRect(0, 0, c.width, c.height);
  if (GL.ok) x.drawImage(GL.gl.canvas, 0, 0);
  x.drawImage(Raster.cv, 0, 0);
  c.toBlob(b => { dl(b, app.fileName.replace(/\W+/g, '_') + '.png'); say('picture kept as PNG'); });
}

/* ============================================================ colour flow */
const COLOUR_STEPS = [
  { key: 'paper', label: 'background colour?' },
  { key: 'ink', label: 'object colour?' },
  { key: 'border', label: 'border colour?' },
  { key: 'bpaper', label: 'banner paper?' },
  { key: 'bink', label: 'banner ink?' }
];
function startColour(back) {
  app.colourIdx = 0; app.colourStep = COLOUR_STEPS[0];
  app.colourBack = back; app.mode = 'colour'; mark();
}
function colourPick(n) {
  const s = COLOUR_STEPS[app.colourIdx];
  app.colours[s.key] = n;
  app.colourIdx++;
  if (app.colourIdx >= COLOUR_STEPS.length) { app.mode = app.colourBack; fit(); bipOK(); return; }
  app.colourStep = COLOUR_STEPS[app.colourIdx];
  fit(); bipOK(); mark();
}

/* ================================================================ shading */
function askShade() {
  app.prompt = {
    title: 'SHADE', text: 'light above, centre or below?',
    text2: 'press  A   C   B',
    keys: {
      a: () => askShade2(1), c: () => askShade2(0), b: () => askShade2(-1)
    }
  };
  mark();
}
function askShade2(v) {
  app.prompt = {
    title: 'SHADE', text: 'light left, centre or right?',
    text2: 'press  L   C   R',
    keys: {
      l: () => askShade3(v, -1), c: () => askShade3(v, 0), r: () => askShade3(v, 1)
    }
  };
  mark();
}
function askShade3(v, h) {
  app.pic.light = [h, v];
  app.prompt = {
    title: 'SHADE', text: 'grey, pattern or Bayer dither?',
    text2: 'press  G   P   B',
    keys: {
      g: () => { app.pic.type = 'gray';    app.prompt = null; bipOK(); mark(); },
      p: () => { app.pic.type = 'pattern'; app.prompt = null; bipOK(); mark(); },
      b: () => { app.pic.type = 'dither';  app.prompt = null; bipOK(); mark(); }
    }
  };
  mark();
}

/* ================================================================== keys */
function keyDown(e) {
  const k = e.key;
  if (k === 'F5' || k === 'F12' || e.ctrlKey || e.metaKey) return;
  if (k.startsWith('Arrow') || k === ' ' || k === 'Enter' || k === 'Backspace') e.preventDefault();

  /* text entry takes everything */
  if (app.input) {
    if (k === 'Enter') { const v = app.input.value.trim(); const cb = app.input.cb; app.input = null; if (v) cb(v); else bipNo(); }
    else if (k === 'Escape') { app.input = null; bipNo(); }
    else if (k === 'Backspace') app.input.value = app.input.value.slice(0, -1);
    else if (k.length === 1 && app.input.value.length < 20) app.input.value += k;
    mark(); return;
  }
  /* modal prompts */
  if (app.prompt) {
    const f = app.prompt.keys[k.toLowerCase()];
    if (f) f(); else if (k === 'Escape') { app.prompt = null; bipNo(); mark(); } else bipNo();
    return;
  }
  handleKey(k, e.shiftKey);
}

function arrowOf(k) {
  switch (k) {
    case 'ArrowLeft': case '5': return [-1, 0];
    case 'ArrowDown': case '6': return [0, -1];
    case 'ArrowUp': case '7': return [0, 1];
    case 'ArrowRight': case '8': return [1, 0];
  }
  return null;
}

function handleKey(k, shift) {
  const lk = k.toLowerCase();

  /* global web extras */
  if (lk === 't' && app.mode !== 'open') { toggleScreen(); return; }

  switch (app.mode) {
    case 'title':
      if (lk === '1') { app.mode = 'create'; app.planeIdx = 0; app.selIdx = 0; }
      else if (lk === '2') app.mode = 'load';
      else if (lk === 'h') app.mode = 'help';
      else app.mode = 'menu';
      bipOK(); mark(); return;

    case 'menu':
      if (lk === 'h') { app.mode = 'help'; mark(); return; }
      if (lk === '1') { if (!hasData()) { say('no data file'); bipNo(); return; } app.mode = 'modify'; app.planeIdx = 0; app.selIdx = 0; bipOK(); mark(); return; }
      if (lk === '2') {
        app.prompt = { title: 'ABANDON', text: 'delete the data file in memory?', text2: 'Y = yes   N = no',
          keys: { y: () => { app.model = newModel(); app.fileName = 'untitled'; app.planeIdx = 0; app.selIdx = 0; app.meshDirty = true; app.cam.dist = 0; app.prompt = null; say('abandoned'); mark(); },
                  n: () => { app.prompt = null; mark(); } } };
        mark(); return;
      }
      if (lk === '3') { app.mode = 'load'; mark(); return; }
      if (lk === '4') {
        if (hasData()) { say('abandon the current file first'); bipNo(); return; }
        app.mode = 'create'; app.planeIdx = 0; app.selIdx = 0; bipOK(); mark(); return;
      }
      if (lk === '5') { if (!hasData()) { say('nothing to save'); bipNo(); return; } app.mode = 'save'; mark(); return; }
      if (lk === '6') { if (!hasData()) { say('no data file'); bipNo(); return; } app.mode = 'display'; app.meshDirty = true; app.cam.dist = 0; bipOK(); mark(); return; }
      if (lk === '7') { startColour('menu'); return; }
      bipNo(); return;

    case 'help':
      if (lk === 'q' || k === 'Escape') { app.mode = 'menu'; mark(); }
      return;

    case 'load':
      if (lk === 'q' || k === 'Escape') { app.mode = 'menu'; mark(); return; }
      if (lk === 'x') { adoptModel(exampleModel(), 'example'); app.mode = 'menu'; return; }
      if (k >= '1' && k <= '9') {
        const f = listFiles()[+k - 1];
        if (f) { loadFile(f); app.mode = 'menu'; } else bipNo();
        return;
      }
      bipNo(); return;

    case 'save':
      if (lk === 'q' || k === 'Escape') { app.mode = 'menu'; mark(); return; }
      if (lk === 's') {
        app.input = { label: 'file name?', value: '', cb: n => { saveFile(n); app.mode = 'menu'; mark(); } };
        mark(); return;
      }
      if (k >= '1' && k <= '9') {
        const f = listFiles()[+k - 1];
        if (f) { saveFile(f); app.mode = 'menu'; } else bipNo();
        return;
      }
      bipNo(); return;

    case 'colour':
      if (lk === 'q' || k === 'Escape') { app.mode = app.colourBack; mark(); return; }
      if (lk === 'b') {
        const s = COLOUR_STEPS[app.colourIdx].key + 'B';
        if (s in app.colours) { app.colours[s] = app.colours[s] ? 0 : 1; fit(); bipOK(); }
        return;
      }
      if (k >= '0' && k <= '7') { colourPick(+k); return; }
      bipNo(); return;

    case 'create': {
      const a = arrowOf(k);
      if (a) { const d = shift ? 1 : 4; shiftFig(a[0] * d, a[1] * d); return; }
      if (lk === 'o') {
        app.open = { pts: [], started: false };
        app.mode = 'open'; bipOK(); mark(); return;
      }
      if (lk === 'f') {
        const pl = curPlane(app.model, app.planeIdx);
        if (pl.rings.length < 2) { bipNo(); return; }
        app.selIdx = (app.selIdx + 1) % pl.rings.length; bipOK(); mark(); return;
      }
      if (lk === 'm') { magnify(1.12); return; }
      if (lk === 'r') { magnify(1 / 1.12); return; }
      if (lk === 'n') { nextZ(shift ? 1 : ZSTEP); return; }
      if (lk === 'c') { closeFigure(); return; }
      if (lk === 'q') {
        closeAllOpen(); app.mode = 'menu'; app.cam.dist = 0;
        if (!app.fileName || app.fileName === 'untitled') app.fileName = 'untitled';
        bipOK(); say('object complete'); mark(); return;
      }
      bipNo(); return;
    }

    case 'open': {
      const a = arrowOf(k);
      if (a) {
        const d = shift ? 1 : 4;
        app.cursor[0] = Math.max(0, Math.min(MW, app.cursor[0] + a[0] * d));
        app.cursor[1] = Math.max(0, Math.min(MH, app.cursor[1] + a[1] * d));
        mark(); return;
      }
      if (lk === 's') {
        if (app.open.started) { say('already started'); bipNo(); return; }
        app.open.pts = [app.cursor.slice()]; app.open.started = true; bipOK(); mark(); return;
      }
      if (lk === 'l') {
        if (!app.open.started) { say('press S to start'); bipNo(); return; }
        const pts = app.open.pts.concat([app.cursor.slice()]);
        if (pts.length > 1 && pts[pts.length - 1][0] === pts[pts.length - 2][0]
            && pts[pts.length - 1][1] === pts[pts.length - 2][1]) { bipNo(); return; }
        if (!ringLegal(pts, false, -1)) { bipNo(); say('lines may not cross'); return; }
        app.open.pts = pts; bipOK(); mark(); return;
      }
      if (lk === 'd') {
        if (app.open.pts.length) { app.open.pts.pop(); if (!app.open.pts.length) app.open.started = false; bipOK(); mark(); }
        else bipNo();
        return;
      }
      if (lk === 'e') {
        const pts = app.open.pts;
        if (pts.length < 3) { say('need at least three points'); bipNo(); return; }
        if (!ringLegal(pts, true, -1)) { say('closing line would cross'); bipNo(); return; }
        newFigure(clonePts(pts));
        app.open = null; app.mode = 'create'; bipOK(); mark(); return;
      }
      if (lk === 'q') { app.open = null; app.mode = 'create'; bipNo(); mark(); return; }
      bipNo(); return;
    }

    case 'modify': {
      const a = arrowOf(k);
      if (a) { const d = shift ? 1 : 4; shiftFig(a[0] * d, a[1] * d); return; }
      if (lk === 'm') { magnify(1.12); return; }
      if (lk === 'r') { magnify(1 / 1.12); return; }
      if (lk === 'f') {
        const pl = curPlane(app.model, app.planeIdx);
        if (pl.rings.length < 2) { bipNo(); return; }
        app.selIdx = (app.selIdx + 1) % pl.rings.length; bipOK(); mark(); return;
      }
      if (lk === 'n') {
        app.planeIdx = (app.planeIdx + 1) % app.model.planes.length;
        app.selIdx = 0; bipOK(); mark(); return;
      }
      if (lk === 'q') { app.mode = 'menu'; app.cam.dist = 0; bipOK(); mark(); return; }
      bipNo(); return;
    }

    case 'display':
    case 'picture': {
      const c = app.cam, fine = shift ? 0.25 : 1;
      const a = arrowOf(k);
      if (a) {
        c.lon -= a[0] * 0.12 * fine;
        c.lat = Math.max(-1.5, Math.min(1.5, c.lat + a[1] * 0.10 * fine));
        mark(); return;
      }
      if (lk === 'n') { c.dist = Math.max(GL.mesh ? GL.mesh.rad * 0.05 : 1, c.dist * (shift ? 0.98 : 0.88)); mark(); return; }
      if (lk === 'f') { c.dist *= shift ? 1.02 : 1.14; mark(); return; }
      if (lk === 'm') { c.scale *= shift ? 1.02 : 1.14; mark(); return; }
      if (lk === 'r') { c.scale /= shift ? 1.02 : 1.14; mark(); return; }
      if (app.mode === 'display') {
        if (lk === 'p') { app.mode = 'picture'; bipOK(); mark(); return; }
        if (lk === 'q') { app.mode = 'menu'; bipOK(); mark(); return; }
      } else {
        if (lk === 'h') { app.pic.type = 'hidden'; bipOK(); mark(); return; }
        if (lk === 'w') { app.pic.type = 'wire'; bipOK(); mark(); return; }
        if (lk === 's') { askShade(); return; }
        if (lk === 'c') { startColour('picture'); return; }
        if (lk === 'k') { keepPNG(); return; }
        if (lk === 'p') { window.print(); return; }
        if (lk === 'q') { app.mode = 'display'; bipOK(); mark(); return; }
      }
      bipNo(); return;
    }
  }
}

/* ================================================================ mouse  */
function toLogical(ev) {
  const r = document.getElementById('scr').getBoundingClientRect();
  const cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
  const cy = (ev.touches ? ev.touches[0].clientY : ev.clientY) - r.top;
  return [cx / r.width * W, cy / r.height * H];
}
function pointerDown(ev) {
  ev.preventDefault();
  const [x, y] = toLogical(ev);
  for (const h of app.hits) {
    if (x >= h.x0 && x < h.x1 && y >= h.y0 && y < h.y1) {
      if (h.key.startsWith('file')) {
        const f = listFiles()[+h.key.slice(4)];
        if (f) { if (app.mode === 'save') saveFile(f); else loadFile(f); app.mode = 'menu'; mark(); }
        return;
      }
      handleKey(h.key, ev.shiftKey); return;
    }
  }
  if (app.mode === 'open' && y > VIEW_TOP && y < VIEW_BOT) {
    app.cursor = [
      Math.max(0, Math.min(MW, Math.round(ux(x)))),
      Math.max(0, Math.min(MH, Math.round(uy(y))))
    ];
    if (!app.open.started) handleKey('s', false); else handleKey('l', false);
    return;
  }
  if ((app.mode === 'display' || app.mode === 'picture') && y > VIEW_TOP && y < VIEW_BOT) {
    app.drag = { x: ev.clientX || 0, y: ev.clientY || 0 };
  }
}
function pointerMove(ev) {
  if (app.mode === 'open' && !ev.buttons) {
    const [x, y] = toLogical(ev);
    if (y > VIEW_TOP && y < VIEW_BOT) {
      app.cursor = [
        Math.max(0, Math.min(MW, Math.round(ux(x)))),
        Math.max(0, Math.min(MH, Math.round(uy(y))))
      ];
      mark();
    }
    return;
  }
  if (app.drag && (app.mode === 'display' || app.mode === 'picture')) {
    const dx = ev.clientX - app.drag.x, dy = ev.clientY - app.drag.y;
    app.drag = { x: ev.clientX, y: ev.clientY };
    app.cam.lon += dx * 0.008;
    app.cam.lat = Math.max(-1.5, Math.min(1.5, app.cam.lat + dy * 0.008));
    mark();
  }
}
function pointerUp() { app.drag = null; }
function wheel(ev) {
  if (app.mode !== 'display' && app.mode !== 'picture') return;
  ev.preventDefault();
  app.cam.dist *= ev.deltaY > 0 ? 1.08 : 1 / 1.08;
  mark();
}

/* ================================================================= setup */
function toggleScreen() {
  app.screenMode = app.screenMode === 'authentic' ? 'highres' : 'authentic';
  document.getElementById('bMode').textContent = 'screen: ' + app.screenMode;
  fit(); bipOK();
}

function boot() {
  Raster.init(document.getElementById('fb'));
  if (!GL.init(document.getElementById('gl'))) console.warn('WebGL 2 unavailable');
  fit();
  addEventListener('resize', fit);
  addEventListener('keydown', keyDown);
  const scr = document.getElementById('scr');
  scr.addEventListener('mousedown', pointerDown);
  scr.addEventListener('touchstart', pointerDown, { passive: false });
  addEventListener('mousemove', pointerMove);
  addEventListener('mouseup', pointerUp);
  scr.addEventListener('wheel', wheel, { passive: false });

  document.getElementById('bMode').onclick = toggleScreen;
  document.getElementById('bFull').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  };
  document.getElementById('bExport').onclick = exportJSON;
  document.getElementById('bHelp').onclick = () => { app.mode = 'help'; mark(); };
  const fi = document.getElementById('file');
  document.getElementById('bImport').onclick = () => fi.click();
  fi.onchange = () => {
    const f = fi.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const m = JSON.parse(rd.result);
        if (!m.planes || !m.figs) throw new Error('not a VU-3D file');
        adoptModel(m, f.name.replace(/\.(vu3d\.)?json$/i, ''));
        app.mode = 'menu';
      } catch (e) { say('bad file'); bipNo(); }
      fi.value = '';
    };
    rd.readAsText(f);
  };

  say('press 2 then X for the example', 4000);
  (function loop() {
    /* cursor blink and transient messages need periodic repaints */
    if (app.mode === 'open' || app.input || (app.message && performance.now() < app.msgUntil + 100)) mark();
    if (app.dirty) { app.dirty = false; paint(); }
    requestAnimationFrame(loop);
  })();
}
boot();
</script>
